name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  base-de-datos:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migraciones y pruebas de seguridad (RLS)
        run: |
          set -e
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/00_stub_supabase.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/rls_test.sql
  secretos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar secretos (solo se permite la clave anon pública)
        run: node tests/secretos.mjs
